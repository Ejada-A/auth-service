name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OCI Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/auth-service:${{ github.run_number }},${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/auth-service:latest

  update-helm:
    needs: build-and-push
    uses: Ejada-A/Terraform-code/.github/workflows/update-helm.yml@main
    with:
      service: "auth-service"
      image_tag: "${{ github.run_number }}"
    secrets: inherit


