name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get OCI Auth Token from Vault
        uses: oracle-actions/run-oci-cli-command@v1.1.1
        id: get-auth-token
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_CLI_REGION: "me-jeddah-1"
        with:
          command: 'secrets secret-bundle get --secret-id ${{ secrets.VAULT_OCIR_AUTH_TOKEN_OCID }}'
          query: 'data."secret-bundle-content".content'

      - name: Decode Auth Token
        id: decode-token
        run: |
          TOKEN=$(echo '${{ steps.get-auth-token.outputs.raw_output }}' | base64 --decode)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login to OCI Registry
        uses: docker/login-action@v3
        with:
          registry: jed.ocir.io
          username: axkjllkftxfz/${{ secrets.OCI_IDENTITY_DOMAIN }}/${{ secrets.OCI_USER_EMAIL }}
          password: ${{ steps.decode-token.outputs.token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jed.ocir.io/axkjllkftxfz/shared-group-a-cmp/auth-service:${{ github.run_number }},jed.ocir.io/axkjllkftxfz/shared-group-a-cmp/auth-service:latest

  update-helm:
    needs: build-and-push
    uses: Ejada-A/Terraform-code/.github/workflows/update-helm.yml@main
    with:
      service: "auth-service"
      image_tag: "${{ github.run_number }}"
    secrets: inherit


