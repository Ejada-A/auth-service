name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install OCI CLI and Get Token
        id: get-token
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_CLI_REGION: "me-jeddah-1"
        run: |
          python -m pip install oci-cli
          export PATH=$PATH:$HOME/.local/bin
          
          mkdir -p ~/.oci
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${OCI_CLI_USER}
          fingerprint=${OCI_CLI_FINGERPRINT}
          tenancy=${OCI_CLI_TENANCY}
          region=${OCI_CLI_REGION}
          key_file=${HOME}/.oci/key.pem
          EOF
          echo "${OCI_CLI_KEY_CONTENT}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          
          TOKEN=$(oci container-registry access-token get --query 'data.token' --raw-output)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login to OCI Registry
        uses: docker/login-action@v3
        with:
          registry: jed.ocir.io
          username: BEARER_TOKEN
          password: ${{ steps.get-access-token.outputs.raw_output }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jed.ocir.io/axkjllkftxfz/shared-group-a-cmp/auth-service:${{ github.run_number }},jed.ocir.io/axkjllkftxfz/shared-group-a-cmp/auth-service:latest

  update-helm:
    needs: build-and-push
    uses: Ejada-A/Terraform-code/.github/workflows/update-helm.yml@main
    with:
      service: "auth-service"
      image_tag: "${{ github.run_number }}"
    secrets: inherit


